# codeflow configuration: every option, with its default where it has one.
# Copy this to codeflow.yml, or run `codeflow init --owner <org>`.

# What to measure. Mix owners and single repos freely; a repo selected twice counts once.
sources:
  # Every repo an organization or user owns.
  - owner: your-org
    include: ["*"]                    # repo-name patterns, case-insensitive (default: all)
    exclude: ["sandbox-*", "*-docs"]  # applied after include (default: none)
    archived: false                   # also measure archived repos
    forks: false                      # also measure forks
  # A single repo. Measured even if it is archived or a fork: naming it is the opt-in.
  - repo: usebruno/bruno

# Measure pull requests active on or after this date (YYYY-MM-DD). Required.
since: 2025-10-01

github:
  api_url: https://api.github.com     # GitHub Enterprise Server: https://HOST/api/v3
  token_env: GITHUB_TOKEN             # falls back to GH_TOKEN, then `gh auth token`

# Where synced data is stored, relative to this file. Keep it out of version control.
data_dir: .codeflow

# How PRs are measured. Everything below is optional.

# Measured branches per repo (owner/name glob → branch names). Default: each repo's default
# branch, plus any branch that was the default before (a rename keeps its history).
branches:
  your-org/legacy-app: [develop]

# A PR whose head is one of these branches, in the same repo, promotes work between long-lived
# branches and isn't counted again. Forks don't count: a fork's `main` is ordinary work.
# Setting this replaces the defaults, which are:
promotions: [main, master, trunk, develop, development, dev, staging, stage, production, prod, release, "release/*", "releases/*"]

bots:
  accounts: [ci-helper]               # treat these logins as bots too (GitHub's own bots always are)
  reviewers: []                       # bots whose reviews count as review, e.g. [coderabbitai]
  include_prs: false                  # count PRs that bots open
  ignore_bodies: ["^Thanks for your contribution"]   # regexes: matching comments are ignored

# What counts as product code. Rules here run before the built-in ones; first match wins.
# Buckets: product, test, docs, generated, vendored, lockfile.
paths:
  - { match: "packages/*-tests/**", bucket: test }
  - { match: ["schema/**", "*.graphql"], bucket: generated, repos: [your-org/api] }

# Teams: who works together. A PR belongs to its author's team on the day they opened it, so a
# person is in one team at a time and a move keeps its history. Give dates (inclusive) when
# someone moves. `secondary: true` lists someone with a team without counting their PRs there.
# Team members also count as internal contributors, whatever GitHub says about them.
teams:
  Platform:
    people: [mika, { login: devon, to: 2026-05-31 }]
  Payments:
    people: [ana, { login: devon, from: 2026-06-01 }, { login: mika, secondary: true }]

# Products: where work lands. A product holds repos (owner/name globs), teams (their PRs in any
# repo), or both. Products may overlap; totals still count each PR once.
products:
  Checkout:
    repos: ["your-org/cart-*", your-org/payments-api]
    teams: [Payments]
